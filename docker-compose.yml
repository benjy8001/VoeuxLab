services:
  phpfpm:
    container_name: 'wedding-voeux'
    build:
      args:
        user: '${WWWUSER:-1000}'
        uid: '${WWWGROUP:-1000}'
      context: ./docker
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - app_network
    depends_on:
      - mariadb
      - redis

  nginx:
    image: nginx:latest
    networks:
      - app_network
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html/
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-rootsecret}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mariadb_volume:/var/lib/mysql'
    networks:
      - app_network

  redis:
    image: 'redis:alpine'
    volumes:
      - 'redis_volume:/data'
    networks:
      - app_network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mariadb_volume:
    driver: local
  redis_volume:
    driver: local
